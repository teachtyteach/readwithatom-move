<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="atom-app" content="1">
<meta name="theme-color" content="#1d1b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Atom has moved</title>
<style>
:root{--bg:#1d1b18;--surface:#26231f;--ink:#f3efe6;--muted:#b9b1a4;--line:#3a3631;--accent:#e8453c}
@media (prefers-color-scheme:light){:root{--bg:#f6f4ef;--surface:#fff;--ink:#1d1b18;--muted:#6f6a5a;--line:#e2ddd2}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));text-align:center}
.ic{display:flex;justify-content:center;margin-bottom:6px}
h1{font:700 30px/1.2 Georgia,"Iowan Old Style",serif;margin:8px 0}
p{color:var(--muted);margin:0 0 18px}
b{color:var(--ink)}
ol{list-style:none;padding:0;margin:0;display:grid;gap:12px;text-align:left;counter-reset:s}
li{counter-increment:s;position:relative;padding:14px 14px 14px 56px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:grid;gap:6px}
li::before{content:counter(s);position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:700 15px/30px system-ui;text-align:center}
li.done::before{content:"✓";background:#2f9e5b}
small{color:var(--muted);font-size:13px}
button,.btn{justify-self:start;font:700 15px system-ui,sans-serif;border-radius:999px;padding:11px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.5}
#msg{margin-top:16px;font-size:14px;color:var(--muted);min-height:1.5em}
</style>
</head>
<body>
<main>
  <div class="ic"><svg viewBox="0 0 48 48" width="64" height="64" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#e8453c"/><path d="M14 25h17M25 17l8 8-8 8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>Atom has moved!</h1>
  <p>Atom's new home is <b>read.learnwithatom.org</b>.<br>Bring your books, stats and rewards with you.</p>
  <ol>
    <li id="s1"><b>Save your backup.</b><small>One file with everything in it.</small><button class="primary" id="save" disabled>Getting your stuff ready…</button></li>
    <li id="s2"><b>Open the new Atom.</b><small>Tap Restore backup and pick your file. Then add it to your home screen.</small><a class="btn" href="https://read.learnwithatom.org/">Open read.learnwithatom.org</a></li>
  </ol>
  <div id="msg"></div>
</main>
<script>
(function () {
  const NEW = "https://read.learnwithatom.org/";
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const msg = t => { document.getElementById("msg").textContent = t; };
  const lib = get("pace:lib", []);
  // nothing saved here? there's nothing to move, so go straight to the new home
  if ((!Array.isArray(lib) || !lib.length) && !get("pace:stats", null) && !get("pace:welcomed", false)) { location.replace(NEW); return; }
  function idbAll() {
    return new Promise(res => {
      let r; try { r = indexedDB.open("pace", 1); } catch (e) { return res({}); }
      r.onupgradeneeded = () => { try { r.result.createObjectStore("books", { keyPath: "id" }); } catch (e) {} };
      r.onerror = () => res({});
      r.onsuccess = () => {
        try {
          const out = {}, tx = r.result.transaction("books", "readonly"), st = tx.objectStore("books"), c = st.openCursor();
          c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.value.id] = cur.value; cur.continue(); } else res(out); };
          c.onerror = () => res(out);
        } catch (e) { res({}); }
      };
    });
  }
  let file = null;
  async function build() {
    const all = await idbAll(), books = [], pos = {}, bm = {}, rd = {}, hq = {};
    for (const m of (Array.isArray(lib) ? lib : [])) {
      if (all[m.id]) books.push(all[m.id]);
      const p = get("pace:pos:" + m.id, null); if (p !== null) pos[m.id] = p;
      const b = get("pace:bm:" + m.id, null); if (b && b.length) bm[m.id] = b;
      const q = get("pace:rd:" + m.id, null); if (q && q.length) rd[m.id] = q;
      if (all["cv:" + m.id] && all["cv:" + m.id].img) hq[m.id] = all["cv:" + m.id].img;
    }
    const settings = get("pace:settings", {}) || {};
    const keys = ["ev", "sp", "sr2", "sec", "arc", "cl", "since", "qb", "evp", "sth", "sgf", "pr", "bday", "tt", "jd", "box", "unlock"];
    const data = { format: "pace-backup", version: 1, name: settings.name || "", saved: new Date().toISOString(), lib: Array.isArray(lib) ? lib : [], books, pos, bm, rd, hq,
      stats: get("pace:stats", { days: {}, books: {}, finished: 0 }), settings, wpm: get("pace:wpm", null), fs: get("pace:fs", null),
      badges: get("pace:badges", {}), wk: get("pace:wk", {}), extra: Object.fromEntries(keys.map(k => [k, get("pace:" + k, null)])) };
    const n = String(settings.name || "").replace(/[^\p{L}\p{N} _-]/gu, "").trim().replace(/\s+/g, "-").slice(0, 30);
    file = new File([JSON.stringify(data)], (n || "Backup") + ".Atom", { type: "application/json" });
    const btn = document.getElementById("save"); btn.disabled = false; btn.textContent = "Save my backup";
    msg(`${books.length} book${books.length === 1 ? "" : "s"} ready to move.`);
  }
  document.getElementById("save").onclick = async () => {
    if (!file) return; let done = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: "Atom backup" }); done = true; } catch (e) { if (e && e.name === "AbortError") return; } }
    if (!done) { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click(); a.remove(); }
    document.getElementById("s1").classList.add("done"); msg("Saved! Now open the new Atom and tap Restore backup.");
  };
  build().catch(() => msg("Something went wrong. Try reloading this page."));
})();
</script>
</body>
</html>
